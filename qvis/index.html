<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q.V.I.S 어시스턴트</title>
<!-- 글꼴: 인터넷이 막힌 내부망에서는 맑은 고딕으로 대신 보인다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<!-- 스타일: 뒤 파일이 앞 파일을 덮어쓴다. 순서를 바꾸지 말 것 -->
<link rel="stylesheet" href="css/00-base.css">
<link rel="stylesheet" href="css/01-tokens.css">
<link rel="stylesheet" href="css/02-layout.css">
<link rel="stylesheet" href="css/03-panels.css">
<link rel="stylesheet" href="css/04-refinements.css">
</head>
<body>
<div class="app">
  <canvas class="sky" id="sky" aria-hidden="true"></canvas>
  <header class="top">
    <div class="brand"><span class="word">Q.V.I.S</span><span class="sub">Agent.SIM</span></div>
    <div class="right"><span class="clock" id="clock"></span><span class="mode" title="AI를 연결하기 전에는 DB 값과 정해진 규칙으로 답합니다"><i aria-hidden="true"></i>AI 미연결 · 규칙 기반</span><button class="voice" id="auto" type="button" aria-pressed="true">자동 브리핑 켜짐</button><button class="voice" id="voice" type="button" aria-pressed="false">읽어주기 꺼짐</button><button class="voice" id="fs" type="button" aria-pressed="false" title="현장 모니터에 띄울 때: 전체화면 + 화면 꺼짐 방지">전체화면</button><span class="badge" id="data-badge" title="CONFIG.dataUrl이 비어 있으면 예시 데이터를 씁니다">예시 데이터</span></div>
  </header>
  <aside class="kpi kpi-l" id="kpi-l" aria-label="오늘 현황"></aside>
  <aside class="kpi kpi-r" id="kpi-r" aria-label="알람 현황"></aside>
  <div class="alertbar" id="alertbar" role="alert">
    <span class="pulse" aria-hidden="true"></span>
    <div class="txt"><span class="k" id="ab-k"></span><span class="m" id="ab-m"></span></div>
    <button type="button" id="ab-x" aria-label="알림 닫기"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg></button>
  </div>

  <main class="main">
  <div class="center-col">
  <div class="stage">
    <canvas id="orb" aria-hidden="true"></canvas>
    <div class="core"><div class="name">Q.V.I.S</div><img class="hanwha-center" src="assets/hanwha-on-dark.png" alt="Hanwha"><div class="state" id="state" role="status" aria-live="polite">무엇이든 물어보세요</div></div>
  </div>

  <section class="talk" aria-live="polite">
    <p class="q" id="q"></p>
    <p class="a" id="a">불량률, 호기별 차이, 가장 큰 문제, 방금 검출된 모듈, 미조치 알람을 물어볼 수 있어요.</p>
    <div class="facts" id="facts"></div>
    <button class="more" id="more" type="button" hidden>근거 보기</button>
  </section>
  </div>
  <aside class="panel" id="panel" aria-label="근거 자료" aria-hidden="true">
    <div class="panel-head"><div><div class="k" id="p-kick"></div><h2 id="p-title"></h2></div><button class="x" id="p-close" type="button" aria-label="근거 닫기"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg></button></div>
    <div id="p-body"></div>
  </aside>
  </main>

  <div class="dock">
    <div class="chips" id="chips"></div>
    <form class="bar" id="form" autocomplete="off">
      <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="음성으로 묻기 (예시 동작)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <input id="ask" type="text" placeholder="Q.V.I.S에게 물어보기" aria-label="질문 입력">
      <button class="send" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </form>
    <p class="hint">예시 데이터로 AI 없이 규칙만으로 답합니다. 자동 브리핑이 켜져 있으면 스스로 묻고 답하며, 화면을 누르면 15초 동안 멈춥니다. 마이크는 실제 음성을 듣지 않습니다.</p>
  </div>
</div>

<!-- 스크립트: 일반 <script>로 차례대로 읽는다 (파일을 더블클릭해도 동작하도록 type="module"은 쓰지 않는다).
     앞 파일의 함수·변수를 뒤 파일이 쓴다. 새 파일은 번호를 붙여 알맞은 자리에 넣는다. -->
<script src="js/00-config.js"></script>
<script src="js/01-util.js"></script>
<script src="js/02-chart-kit.js"></script>
<script src="js/10-data-sample.js"></script>
<script src="js/11-data-schema.js"></script>
<script src="js/20-rules.js"></script>
<script src="js/30-dom.js"></script>
<script src="js/40-panel.js"></script>
<script src="js/41-panel-el.js"></script>
<script src="js/42-panel-anova.js"></script>
<script src="js/43-panel-stats.js"></script>
<script src="js/50-app.js"></script>
<script src="js/51-data-source.js"></script>
<script src="js/60-orb.js"></script>
<script src="js/61-sky.js"></script>
<script src="js/90-boot.js"></script>
<script src="js/95-layout-check.js"></script>
</body>
</html>
