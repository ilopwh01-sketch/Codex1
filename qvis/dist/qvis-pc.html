<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q.V.I.S 어시스턴트</title>
<!-- 글꼴: 인터넷이 막힌 내부망에서는 맑은 고딕으로 대신 보인다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<!-- 스타일: 뒤 파일이 앞 파일을 덮어쓴다. 순서를 바꾸지 말 것 -->
<style>
/* css/00-base.css */
/* 00-base.css · 바탕 규칙. 간격·줄바꿈은 여기서 정한 단계만 쓴다 (AGENTS.md "간격 규칙")
   - 간격: --s1 4px · --s2 8px · --s3 12px · --s4 16px · --s5 24px · --s6 32px  (이 밖의 숫자 금지)
   - 줄바꿈: 한글은 단어 단위(keep-all). 숫자+단위는 한 덩어리(.nw). 말줄임(…)은 쓰지 않는다
   - 배치 부품: .stack(세로) .row(가로) .cols-2(두 단) — margin 대신 gap으로 간격을 준다 */
:root { --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; }
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { word-break: keep-all; overflow-wrap: anywhere; }
.nw, .tabular, svg text { white-space: nowrap; }
.tabular { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: var(--gap, var(--s3)); min-width: 0; }
.row { display: flex; align-items: center; gap: var(--gap, var(--s2)); min-width: 0; flex-wrap: wrap; }
.cols-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap, var(--s4)); }
@media (max-width: 700px) { .cols-2 { grid-template-columns: minmax(0, 1fr); } }
#data-badge.bad { background: rgba(243, 115, 33, 0.16); color: #FFC9A3; border-color: rgba(243, 115, 33, 0.5); }
</style>
<style>
/* css/01-tokens.css */
/* 색·글자 변수. 색을 바꿀 때는 이 파일만 고친다 (4톤 규칙: AGENTS.md) */
/* Layout: 어두운 한 화면. 가운데 일렁이는 구체 → 그 아래 질문과 답 → 맨 아래 추천 질문과 입력창. 어두운 화면 하나로 고정. */
:root {
  color-scheme: dark;
  --bg: #071226; --panel: #0D1C38; --line: #1B2F52; --ink: #E8F0F7; --ink-2: #B4C3D6; --muted: #8FA3BF;
  --teal: #1FCFBE; --blue: #0A8FCB; --violet: #0B3B8F; --gold: #FFA766; --warm: #F37321;
  /* 4톤 규칙: 네이비 바탕 · 미스트 글자 · 민트(→청록→블루 그라데이션) 조작/정상 · 오렌지 불량/알람 */
  --grad: linear-gradient(90deg, #8EDDBB, #14C3B4 35%, #0A8FCB 70%, #0B3B8F);
  --brand-1: #1DC0BA; --brand-2: #1095C6;
  --font: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --display: 'Space Grotesk', 'Noto Sans KR', system-ui, sans-serif;
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
}
</style>
<style>
/* css/02-layout.css */
/* 기본 화면: 머리줄, 오브, 질문·답, 추천 질문, 입력창, 새 불량 알림 */
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.app { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 18px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(60% 46% at 50% 38%, rgba(31, 207, 190, 0.10), rgba(31, 207, 190, 0) 70%),
    radial-gradient(42% 38% at 84% 14%, rgba(11, 59, 143, 0.14), rgba(11, 59, 143, 0) 72%),
    radial-gradient(48% 40% at 10% 82%, rgba(10, 143, 203, 0.13), rgba(10, 143, 203, 0) 72%),
    radial-gradient(30% 26% at 72% 88%, rgba(255, 150, 90, 0.06), rgba(255, 150, 90, 0) 72%),
    linear-gradient(180deg, #0A1834, #071226 60%, #050E1F); }
/* 별: 화면 뒤에 고정된 캔버스 */
.sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.top, .main, .dock { position: relative; z-index: 1; }
.top { width: 100%; max-width: 1080px; display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; flex-direction: column; gap: 3px; }
.brand .word { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: 1px; color: var(--brand-1); background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand .sub { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
/* 한화 공식 로고 파일을 넣을 자리 */
.logo-slot { height: 16px; padding: 0 6px; border: 1px dashed var(--muted); border-radius: 4px; font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; }
.core .hanwha-center { height: 24px; width: auto; display: block; margin: 4px 0 2px; filter: drop-shadow(0 0 8px rgba(7, 18, 38, 0.95)); }
.main { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #15284A; color: var(--ink-2); border: 1px solid var(--line); }

.stage { position: relative; width: min(100%, 580px, calc(100vh - 572px)); min-width: 230px; aspect-ratio: 1; max-width: 100%; flex-shrink: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.core { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none; text-align: center; }
.core .name { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6.4vw, 46px); line-height: 1; letter-spacing: 0.06em; padding-left: 0.06em; color: #C9F7EC; background: linear-gradient(180deg, #E9FCFF 10%, var(--brand-1) 60%, var(--brand-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(7, 18, 38, 0.95)) drop-shadow(0 0 18px rgba(31, 207, 190, 0.35)); }
.core { transition: opacity 260ms linear; }
.core.merged { opacity: 0.35; }
.core .state { font-size: 14px; font-weight: 500; color: var(--ink); text-shadow: 0 0 12px rgba(7, 18, 38, 1); min-height: 22px; transition: opacity 200ms linear; }

.talk { width: 100%; max-width: 760px; min-height: 128px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.q { color: var(--ink-2); font-size: 15px; min-height: 24px; }
.a { font-size: clamp(18px, 2.6vw, 24px); line-height: 1.5; font-weight: 500; text-wrap: balance; word-break: keep-all; min-height: 64px; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 34px; }
.fact { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 700; opacity: 0; transform: translateY(6px); transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out); }
.fact.on { opacity: 1; transform: none; }
.fact.alert { border-color: var(--warm); color: #FFD2A8; }

.dock { width: 100%; max-width: 760px; margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--ink-2); cursor: pointer; transition: background-color 100ms linear, border-color 100ms linear, transform 100ms var(--ease-out); }
.chip:hover { background: var(--panel); border-color: var(--teal); color: var(--ink); }
.chip:active, .mic:active, .send:active { transform: scale(0.96); }
.bar { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); transition: border-color 150ms linear, box-shadow 150ms linear; }
.bar:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(31, 207, 190, 0.16); }
.bar input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 8px 6px; }
.bar input::placeholder { color: var(--muted); }
.mic, .send { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; transition: transform 100ms var(--ease-out), background-color 150ms linear, box-shadow 150ms linear; }
.mic { background: #15284A; }
.mic[aria-pressed="true"] { background: var(--teal); box-shadow: 0 0 0 6px rgba(31, 207, 190, 0.18); }
.mic svg, .send svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mic[aria-pressed="true"] svg { stroke: #06203A; }
.send { background: var(--teal); }
.send svg { stroke: #06203A; }
.hint { text-align: center; font-size: 12px; color: var(--muted); }
/* 새 불량 알림 배너: 위에서 내려옴 */
.alertbar { position: fixed; z-index: 20; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(680px, calc(100% - 32px)); box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 16px; border-radius: 14px;
  background: rgba(38, 20, 10, 0.92); border: 1px solid var(--warm); box-shadow: 0 0 0 4px rgba(243, 115, 33, 0.12), 0 18px 50px rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
  transform: translate(-50%, calc(-100% - 40px)); opacity: 0; visibility: hidden; transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms linear, visibility 0s linear 420ms; }
.alertbar.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms linear, visibility 0s; }
.alertbar .pulse { position: relative; width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; background: var(--warm); }
.alertbar .pulse::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--warm); animation: ping 1200ms var(--ease-out) infinite; }
@keyframes ping { from { transform: scale(0.5); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
.alertbar .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.alertbar .k { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFB385; }
.alertbar .m { font-size: 15px; font-weight: 700; }
.alertbar button { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(255, 179, 133, 0.4); background: transparent; cursor: pointer; display: grid; place-items: center; }
.alertbar button svg { width: 12px; height: 12px; fill: none; stroke: #FFD6B8; stroke-width: 2; stroke-linecap: round; }
.chip.alert-chip { border-style: dashed; border-color: rgba(243, 115, 33, 0.7); color: #FFC9A3; }
.chip.alert-chip:hover { border-color: var(--warm); }
.right { display: flex; align-items: center; gap: 10px; }
.voice { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.voice[aria-pressed="true"] { border-color: var(--teal); color: var(--teal); }
</style>
<style>
/* css/03-panels.css */
/* 근거 팝업과 그 안의 그래프·표·EL 이미지 */
/* 근거 패널의 공정 경로 */
.route { list-style: none; margin: 0; padding: 0; }
.route li { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; animation: rise 320ms var(--ease-out) both; animation-delay: calc(var(--i) * 90ms + 200ms); }
.route li:not(:last-child)::before { content: ""; position: absolute; left: 8px; top: calc(50% + 6px); width: 2px; height: calc(100% - 12px); background: var(--line); }
.route .dot { position: relative; z-index: 1; justify-self: center; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 2px solid #3A5480; background: var(--bg); }
.route li.hot .dot { border-color: var(--warm); }
.route li.bad .dot { background: var(--warm); border-color: var(--warm); box-shadow: 0 0 10px var(--warm); }
.route .st { font-weight: 700; font-size: 14px; }
.route .sub { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.route li.hot .sub, .route li.bad .sub { color: #FFC9A3; }
.route .tm { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* 근거 패널의 시간대별 그래프 */
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--teal); vertical-align: middle; margin-right: 6px; }
.legend i.u { border-top: 2px dashed #8FA3BF; }
.legend i.t { border-top: 1.5px solid var(--ink); opacity: 0.6; }
.chartwrap { position: relative; touch-action: pan-y; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: #1B2F52; stroke-width: 1; }
.chart text { fill: var(--muted); font-family: var(--font); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart text.lab { fill: var(--ink-2); }
.chart text.end-lab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.chart .target { stroke: var(--ink); stroke-opacity: 0.5; stroke-width: 1.2; }
.chart .usual { fill: none; stroke: #8FA3BF; stroke-width: 2; stroke-dasharray: 5 5; opacity: 0.85; }
.chart .today, .chart .over { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.chart .today { stroke: var(--teal); animation: draw 900ms var(--ease-out) 200ms forwards; }
.chart .over { stroke: var(--warm); stroke-width: 2.5; animation: draw 500ms var(--ease-out) 950ms forwards; }
.chart .wash { fill: rgba(31, 207, 190, 0.1); opacity: 0; animation: fade 400ms linear 700ms forwards; }
.chart .hotwash { fill: rgba(243, 115, 33, 0.16); opacity: 0; animation: fade 400ms linear 1100ms forwards; }
.chart .end { opacity: 0; animation: fade 300ms linear 1250ms forwards; }
.chart .ring { fill: none; stroke: var(--warm); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 1400ms var(--ease-out) 1300ms infinite; }
.chart .cross { stroke: var(--ink-2); stroke-width: 1; }
@keyframes fade { to { opacity: 1; } }
.ctip { position: absolute; left: 0; top: 0; pointer-events: none; background: #EAF2F8; color: #071226; border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.4; white-space: nowrap; opacity: 0; transform: translate(-50%, -115%); transition: opacity 100ms linear; }
.ctip.on { opacity: 1; }
.ctip b { display: block; font-size: 14px; }
/* EL 이미지: 홀로그램처럼 깜빡이며 뜨고, 스캔선이 지나가면 검출 칸이 잡힌다 */
.elview { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(31, 207, 190, 0.45); box-shadow: 0 0 0 1px rgba(31, 207, 190, 0.12), 0 0 40px rgba(31, 207, 190, 0.18); background: #020407; }
.elimg { display: block; width: 100%; height: auto; animation: holo 700ms linear both; }
@keyframes holo { 0% { opacity: 0; filter: brightness(2) saturate(0); } 18% { opacity: 0.7; } 30% { opacity: 0.15; } 46% { opacity: 0.9; } 60% { opacity: 0.5; } 100% { opacity: 1; filter: none; } }
.elview .grain { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(31, 207, 190, 0.05) 0 1px, transparent 1px 4px); mix-blend-mode: screen; }
.elview .scan { position: absolute; left: 0; right: 0; top: 0; height: 18%; pointer-events: none; background: linear-gradient(180deg, rgba(31, 207, 190, 0), rgba(31, 207, 190, 0.35) 85%, rgba(220, 252, 255, 0.9)); opacity: 0; animation: scan 900ms cubic-bezier(0.45, 0, 0.55, 1) 300ms both; }
@keyframes scan { 0% { transform: translateY(-100%); opacity: 1; } 95% { opacity: 1; } 100% { transform: translateY(560%); opacity: 0; } }
.elview .brk { position: absolute; width: 22px; height: 22px; border-color: var(--teal); border-style: solid; border-width: 0; }
.brk.tl { left: 8px; top: 8px; border-left-width: 2px; border-top-width: 2px; } .brk.tr { right: 8px; top: 8px; border-right-width: 2px; border-top-width: 2px; }
.brk.bl { left: 8px; bottom: 8px; border-left-width: 2px; border-bottom-width: 2px; } .brk.br { right: 8px; bottom: 8px; border-right-width: 2px; border-bottom-width: 2px; }
.elview .hud { position: absolute; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #C9F7EC; text-shadow: 0 0 6px rgba(0, 0, 0, 0.9); padding: 3px 8px; border-radius: 4px; background: rgba(2, 4, 7, 0.65); }
.hud.h1 { left: 36px; top: 12px; } .hud.h2 { right: 36px; top: 12px; color: #FFC9A3; } .hud.h3 { left: 36px; bottom: 12px; font-weight: 500; color: var(--ink-2); }
.elbox { position: absolute; box-sizing: border-box; border: 2px solid var(--warm); border-radius: 3px; box-shadow: 0 0 14px rgba(243, 115, 33, 0.7), inset 0 0 12px rgba(243, 115, 33, 0.35); opacity: 0; transform: scale(1.6); animation: lock 320ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--d) forwards; }
.elbox.warn { border-color: #FFA766; box-shadow: 0 0 14px rgba(255, 167, 102, 0.6), inset 0 0 12px rgba(255, 167, 102, 0.3); }
@keyframes lock { to { opacity: 1; transform: none; } }
.elbox .tag { position: absolute; left: -2px; bottom: calc(100% + 4px); white-space: nowrap; font-size: 11px; font-weight: 700; color: #1A0A06; background: var(--warm); padding: 1px 6px; border-radius: 3px; }
.elbox .tag.below { bottom: auto; top: calc(100% + 4px); }
.elbox.warn .tag { background: #FFA766; }
@property --k { syntax: '<number>'; inherits: true; initial-value: 1; }
.elstage { position: relative; transform-origin: 0 0; transition: transform 140ms var(--ease-out), --k 140ms var(--ease-out); --k: 1; will-change: transform; }
.elstage.noanim { transition: none; }
.elview { touch-action: none; user-select: none; }
.elview.zoomed { cursor: grab; }
.elview.dragging { cursor: grabbing; }
/* 확대 창: 불량 자리에서 튕기듯 튀어나오고, 누르면 줄어들며 사라진다 */
.elpop { position: absolute; z-index: 3; width: 34%; aspect-ratio: 3 / 2; padding: 0; border-radius: 12px; overflow: hidden; cursor: pointer; background: #020407; border: 2px solid var(--warm);
  box-shadow: 0 0 0 4px rgba(243, 115, 33, 0.14), 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 26px rgba(243, 115, 33, 0.45); opacity: 0; transform: scale(0.2); transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 160ms linear; }
.elpop.warn { border-color: #FFA766; box-shadow: 0 0 0 4px rgba(255, 167, 102, 0.14), 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 26px rgba(255, 167, 102, 0.4); }
.elpop.on { opacity: 1; transform: none; }
.elpop.off { opacity: 0; transform: scale(0.3); transition: transform 240ms cubic-bezier(0.4, 0, 1, 1), opacity 200ms linear 40ms; }
.elpop:hover { filter: brightness(1.08); }
.elpop canvas { display: block; width: 100%; height: 100%; }
.elpop .zl { position: absolute; left: 0; right: 0; bottom: 0; padding: 7px 12px; font-size: 15px; font-weight: 700; text-align: left; background: rgba(2, 4, 7, 0.78); color: #FFD6B8; }
.elpop.warn .zl { color: #FFE0C2; }
.eline { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
.eline line { stroke: var(--warm); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 380ms var(--ease-out); }
.eline circle { fill: var(--warm); opacity: 0; transition: opacity 200ms linear; }
.eline.warn line { stroke: #FFA766; } .eline.warn circle { fill: #FFA766; }
.eline.on line { stroke-dashoffset: 0; } .eline.on circle { opacity: 1; }
.elpop::after { content: "×"; position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; line-height: 28px; border-radius: 50%; font-size: 20px; color: #fff; background: rgba(2, 4, 7, 0.6); }
.elview { cursor: zoom-in; }
.elview.zoomed { cursor: zoom-out; }
.elstage .elbox { border-width: calc(2px / var(--k)); border-radius: calc(3px / var(--k)); }

.anv .dev { stroke: var(--teal); stroke-width: 1.6; opacity: 0; animation: fade 300ms linear forwards; animation-delay: calc(var(--i) * 120ms + 1200ms); }
.anv .dev.hot { stroke: var(--warm); stroke-width: 2.2; }
.anv-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; margin-top: 12px; }
.fcard, .pcard { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(232, 240, 247, 0.02); display: flex; flex-direction: column; gap: 8px; animation: rise 320ms var(--ease-out) both; animation-delay: 700ms; }
.fcard .frow { display: flex; align-items: center; gap: 10px; }
.fcard .fF { font-weight: 700; font-size: 18px; }
.fcard .frac { flex: 1; display: flex; flex-direction: column; text-align: center; font-size: 13px; font-weight: 700; }
.fcard .frac span { padding: 3px 0; }
.fcard .frac .nu { border-bottom: 1.5px solid var(--ink); }
.fcard .nu { color: var(--teal); }
.fcard .de { color: var(--ink-2); }
.fcard .fl { font-size: 14px; color: var(--ink-2); padding-left: 2px; animation: rise 300ms var(--ease-out) both; animation-delay: calc(var(--i) * 350ms + 1000ms); font-variant-numeric: tabular-nums; }
.fcard .fl b { font-size: 17px; }
.fcard .fl .fv { font-size: 26px; color: var(--ink); }
.fcard .df { margin-left: 10px; font-size: 12px; color: var(--muted); }
.fdist { width: 100%; height: auto; }
.fdist .axis { stroke: var(--line); }
.fdist .fcurve { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 900ms var(--ease-out) 900ms forwards; }
.fdist .tail { fill: var(--warm); opacity: 0; animation: fade 400ms linear 1700ms forwards; }
.fdist .fmk { fill: var(--ink); }
.fdist .fv-t { fill: var(--ink); font-size: 12px; font-weight: 700; }
.fdist .brk { fill: none; stroke: var(--warm); stroke-width: 1.4; }
.fdist .pv-t { fill: #FFB385; font-size: 14px; font-weight: 700; }
.pcard .verdict { padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; background: #15284A; color: var(--ink-2); }
.pcard .verdict.sig { background: rgba(243, 115, 33, 0.16); color: #FFC9A3; border: 1px solid rgba(243, 115, 33, 0.5); }
@media (max-width: 700px) { .anv-row { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .anv .kd, .anv .jd, .anv .gm, .anv .dev, .fdist .tail { animation: none; opacity: 1; } .anv .kl, .fdist .fcurve { animation: none; stroke-dashoffset: 0; } .fcard, .pcard, .fcard .fl { animation: none; } }
/* 대형 화면 좌우 숫자: 오브 양옆의 빈 공간에 핵심 숫자 4개 */
.kpi { position: fixed; top: 50%; z-index: 1; display: none; flex-direction: column; gap: 34px; width: clamp(210px, 16vw, 320px); transform: translateY(-46%); transition: opacity 260ms linear, visibility 0s linear 260ms; }
@media (min-width: 1280px) and (min-height: 700px) { .kpi { display: flex; } }
.kpi-l { left: max(32px, 4.5vw); }
.kpi-r { right: max(32px, 4.5vw); text-align: right; }
.app.open .kpi { opacity: 0; visibility: hidden; }
.kp { display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid var(--line); animation: rise 420ms var(--ease-out) both; animation-delay: calc(var(--i) * 120ms + 200ms); }
.kp .kl { font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.02em; }
.kp b { font-size: clamp(44px, 3.7vw, 72px); line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kp .ku { font-size: 0.36em; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kp .ks { font-size: 13px; color: var(--muted); }
.kp.hot b { color: #FFB385; }
.kp.hot .ks { color: #FFB385; }
.kp.hot { border-top-color: rgba(243, 115, 33, 0.55); }
.kpi-l .kp:first-child:not(.hot) b { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.clock { font-size: 13px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-right: 4px; }
@media (prefers-reduced-motion: reduce) { .kp { animation: none; } .kpi { transition: none; } }
.fcard .fx { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); word-break: keep-all; }
.fcard .fx b { color: var(--ink); }
.kp b { margin-bottom: 4px; }
@media (min-width: 901px) and (max-height: 899px) { .anv-row { margin-top: 8px; } .fcard, .pcard { padding: 10px 12px; gap: 6px; } }
.anv-row.one { grid-template-columns: minmax(0, 1fr); }
/* F 카드가 한 줄을 다 쓸 때: 왼쪽 식(최대 420px) · 오른쪽 숫자. 분수선이 길게 늘어지지 않게 */
.anv-row.one .fcard { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); column-gap: var(--s6); row-gap: var(--s2); align-items: center; }
.anv-row.one .fcard .mini-k, .anv-row.one .fcard .fx { grid-column: 1 / -1; }
.anv-row.one .fcard .frow { grid-row: 2 / span 2; }
.anv-row.one .fcard .fl { grid-column: 2; }
/* 낮은 화면(1366×768 등)에서도 입력창이 한 화면에 들어오게 */
@media (max-height: 820px) { .stage { width: min(100%, 520px, calc(100vh - 470px)); } .talk { min-height: 96px; gap: 6px; } .a { min-height: 40px; } .hint { display: none; } .app { gap: 8px; padding-block: 14px 14px; } }
@media (max-height: 1040px) { .hint { display: none; } }
</style>

var RULES = {
  trend: function (d) {
    var hr = d.hourly, n = hr.today.length - 1, now = hr.today[n], cross = null;
    for (var i = 1; i <= n && cross === null; i++) { if (hr.today[i - 1] <= d.target && hr.today[i] > d.target) { cross = hr.hours[i - 1] + (d.target - hr.today[i - 1]) / (hr.today[i] - hr.today[i - 1]) * (hr.hours[i] - hr.hours[i - 1]); } }
    var j = n; while (j > 0 && hr.hours[n] - hr.hours[j] < 1) { j--; }

    return {
      a: (cross !== null ? hmTxt(cross) + '부터 불량률이 목표 ' + f2(d.target) + '%를 넘기 시작해 ' : '') + '지금은 ' + f1(now) + '%입니다. 같은 시간대 평소 수준은 ' + f1(hr.usual[n]) + '%입니다.',
      facts: ['지금 ' + f1(now) + '%', '목표 ' + f2(d.target) + '%'].concat(cross !== null ? [hmClock(cross) + '부터 초과'] : []),
      alert: now > d.target * 1.5 ? 0.8 : now > d.target ? 0.5 : 0,
      panel: { type: 'chart', kicker: '시간대별 불량률', title: '오늘 06시 ~ 지금 · ' + d.line, target: d.target, yMax: Math.max(3.5, Math.ceil(now + 0.5)), hours: hr.hours, today: hr.today, usual: hr.usual },
      actions: [{ t: '초과 시작 전후 설비 변경 이력 확인 (' + hr.change + ')', who: '공정' }, { t: '초과 구간 생산분 EL 재검 여부 결정', who: '품질' }],
      feedback: rise > 0 ? '최근 1시간 동안 ' + f1(rise) + '%p 올랐습니다. 지금 속도가 이어지면 1시간 뒤 ' + f1(next) + '% 안팎이 됩니다.' : '최근 1시간 동안 더 오르지 않았습니다.'

      facts: ['불량률 ' + f2(r) + '%', '목표 ' + f2(d.target) + '%', '검사 ' + num(d.inspected) + '매'],

      actions: diff > 0 ? [{ t: top[0] + ' 공정 불량 ' + top[1] + '건 내역 확인', who: '공정' }, { t: '목표 초과 원인을 근무조 회의 안건으로 등록', who: '반장' }] : [{ t: '다음 정기 점검 시각까지 현재 상태 유지', who: '공정' }],

      a: s.time + '에 검사한 모듈에서 ' + parts.join('과 ') + '을 찾았습니다. 판정은 ' + s.verdict + '입니다.',

<script>
/* js/50-app.js */
/* 50-app.js · 답 보여주기, 읽어주기, 새 불량 알림, 자동 브리핑, 마이크, 좌우 숫자, 시계, 전체화면, 추천 질문 칩 */
function setState(n) { S.name = n; stateEl.textContent = LABEL[n]; S.spinT = n === 'alert' ? 2.6 : n === 'thinking' ? 1.9 : n === 'listening' ? 0.5 : 0.25; if (n === 'idle') { S.alertT = 0; } if (n === 'alert') { S.alertT = 1; } mic.setAttribute('aria-pressed', n === 'listening' ? 'true' : 'false'); if (n === 'speaking' && M.phase === 'free') { M.phase = 'in'; M.time = 0; } if (reduce) { draw(performance.now()); } }

voiceBtn.addEventListener('click', function () {

});

  try { var u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.05; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {}
}

/* 답을 화면에 내보내기: 한 글자씩 → 수치 칩 → 근거 패널 */
function present(res, mine) {
  setState('speaking'); S.alertT = res.alert; say(res.a);
  var i = 0;
  return new Promise(function (done) {
    (function type() {
      if (mine !== run) { return done(); }
      i = reduce ? res.a.length : i + 1; aEl.textContent = res.a.slice(0, i);

    })();
  }).then(function () {
    if (mine !== run) { return; }
    res.facts.forEach(function (f, k) { var c = document.createElement('span'); c.className = 'fact' + (k === 0 && res.alert >= 0.7 ? ' alert' : ''); c.textContent = f; factsEl.appendChild(c); setTimeout(function () { c.classList.add('on'); }, 60 + k * 90); });
    if (res.panel) { res.panel.actions = res.actions; res.panel.feedback = res.feedback; more.hidden = false; setTimeout(function () { if (mine === run) { openPanel(res.panel); } }, reduce ? 0 : 450); }
    return wait(900).then(function () { if (mine === run) { setState('idle'); } });
  });
}
function reset() { qEl.textContent = ''; aEl.textContent = ''; factsEl.textContent = ''; closePanel(); more.hidden = true; lastPanel = null; }
function answer(text) {

  reset(); qEl.textContent = '“' + text + '”';
  setState('thinking');
  return wait(1100).then(function () { if (mine === run) { return present(res, mine); } });
}

/* ---------- 새 불량 알림 (예시 데이터: 실제로는 DB에서 새 FQC 불량을 읽어 옴) ---------- */

    if (mine !== run) { return; }

  });
